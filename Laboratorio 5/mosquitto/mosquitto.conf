# Broker MQTT del laboratorio 5 (MQTT 3.1.1 y 5.0 en el puerto 1883)
listener 1883
allow_anonymous false
password_file /mosquitto/auth/passwd

# Persistencia: los mensajes QoS 1 de la ingesta quedan guardados si se reinicia el broker
# o si la ingesta deja de confirmar mientras InfluxDB no responde.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60
# 4 dias de toma a una lectura cada 10 s son unas 35 000 lecturas; la cola alcanza para todas.
max_queued_messages 50000

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp_format %Y-%m-%dT%H:%M:%S
connection_messages true
