# Datasource de Grafana hacia la TSDB. Grafana solo lee InfluxDB; no recibe datos del protocolo.
apiVersion: 1

datasources:
  - name: InfluxDB lab5
    uid: influx-lab5
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: ${INFLUX_ORG}
      defaultBucket: ${INFLUX_BUCKET}
      timeInterval: 10s
    secureJsonData:
      token: ${INFLUX_TOKEN}
