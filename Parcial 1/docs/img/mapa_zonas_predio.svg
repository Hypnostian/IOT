<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" font-family="Segoe UI, Calibri, Arial, sans-serif">
  <defs>
    <pattern id="cacao" width="26" height="26" patternUnits="userSpaceOnUse">
      <rect width="26" height="26" fill="#dcfce7"/>
      <circle cx="13" cy="13" r="4.5" fill="#86efac"/>
      <circle cx="13" cy="11" r="1.6" fill="#4d7c0f"/>
    </pattern>
    <pattern id="bosque" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="#bbf7d0"/>
      <path d="M15,6 L22,20 L8,20 Z" fill="#15803d" opacity="0.65"/>
    </pattern>
    <marker id="pin" markerWidth="6" markerHeight="6" refX="3" refY="3">
      <circle cx="3" cy="3" r="3" fill="#0f172a"/>
    </marker>
    <style>
      .zona     { stroke:#64748b; stroke-width:2; rx:10; }
      .zonaTit  { font-size:15px; font-weight:700; fill:#14532d; }
      .zonaSub  { font-size:11.5px; fill:#365314; }
      .chip     { rx:12; }
      .chipTxt  { font-size:12px; font-weight:700; fill:#ffffff; }
      .leyenda  { font-size:12.5px; fill:#334155; }
      .nota     { font-size:11.5px; fill:#64748b; }
    </style>
  </defs>

  <rect width="1200" height="820" fill="#ffffff"/>

  <text x="36" y="42" font-size="24" font-weight="700" fill="#0f172a">Granja Zenón — Cacao · Mapa de zonas y ubicación de los 10 dispositivos</text>
  <text x="36" y="66" font-size="13" fill="#64748b">Predio de 11,4 ha · Vereda La Colorada, San Vicente de Chucurí (Santander) · Altitud 692 m s. n. m.</text>

  <!-- Marco del predio -->
  <rect x="36" y="86" width="880" height="700" rx="14" fill="#f7fee7" stroke="#4d7c0f" stroke-width="3"/>

  <!-- Quebrada -->
  <path d="M36,470 C180,440 260,520 400,486 C540,452 640,530 916,498" fill="none" stroke="#38bdf8" stroke-width="14" opacity="0.55"/>
  <text x="120" y="462" class="nota" fill="#0369a1">Quebrada La Colorada</text>

  <!-- Camino de saca -->
  <path d="M470,786 L470,300 L916,300" fill="none" stroke="#a8a29e" stroke-width="16" stroke-dasharray="20 10" opacity="0.7"/>
  <text x="482" y="740" class="nota" transform="rotate(-90 482,740)">Camino de saca (destapado)</text>

  <!-- ===== Lotes de cultivo ===== -->
  <rect class="zona" x="64" y="118" width="250" height="160" fill="url(#cacao)"/>
  <text class="zonaTit" x="80" y="144">Lote 1 — Zenón Alto</text>
  <text class="zonaSub" x="80" y="164">3,2 ha · variedad CCN-51</text>
  <text class="zonaSub" x="80" y="182">Suelo franco-arcilloso</text>

  <rect class="zona" x="64" y="296" width="250" height="150" fill="url(#cacao)"/>
  <text class="zonaTit" x="80" y="322">Lote 2 — Zenón Bajo</text>
  <text class="zonaSub" x="80" y="342">2,4 ha · variedad ICS-95</text>
  <text class="zonaSub" x="80" y="360">Terraza aluvial</text>

  <rect class="zona" x="64" y="530" width="250" height="150" fill="url(#cacao)"/>
  <text class="zonaTit" x="80" y="556">Lote 3 — La Vega</text>
  <text class="zonaSub" x="80" y="576">2,8 ha · variedad TCS-01</text>
  <text class="zonaSub" x="80" y="594">Renovación de 2 años</text>

  <!-- ===== Dosel / sombrio ===== -->
  <rect class="zona" x="336" y="118" width="212" height="160" fill="url(#bosque)"/>
  <text class="zonaTit" x="352" y="144">Dosel y sombrío</text>
  <text class="zonaSub" x="352" y="164">Bosque de Bartolito</text>
  <text class="zonaSub" x="352" y="182">Cordia alliodora</text>
  <text class="zonaSub" x="352" y="200">y plátano hartón</text>
  <text class="zonaSub" x="352" y="218">Altura 12,5 m</text>

  <!-- ===== Estacion de campo / casa ===== -->
  <rect class="zona" x="336" y="296" width="212" height="150" fill="#fef9c3"/>
  <text class="zonaTit" x="352" y="322">Casa de Zenón</text>
  <text class="zonaSub" x="352" y="342">Estación de campo</text>
  <text class="zonaSub" x="352" y="360">Router 4G/LTE + Starlink</text>
  <text class="zonaSub" x="352" y="378">Concentrador Wi-Fi</text>

  <!-- ===== Torre meteorologica ===== -->
  <rect class="zona" x="570" y="118" width="212" height="160" fill="#e0f2fe"/>
  <text class="zonaTit" x="586" y="144">Torre Zenón</text>
  <text class="zonaSub" x="586" y="164">Meteorología del predio</text>
  <text class="zonaSub" x="586" y="182">Mástil de 10 m, a cielo</text>
  <text class="zonaSub" x="586" y="200">abierto sobre el lote 1</text>

  <!-- ===== Poscosecha ===== -->
  <rect class="zona" x="570" y="530" width="316" height="150" fill="#fed7aa"/>
  <text class="zonaTit" x="586" y="556">Marinela — beneficiadero</text>
  <text class="zonaSub" x="586" y="576">6 cajones de fermentación en cascada</text>
  <text class="zonaSub" x="586" y="594">Marquesina de secado de 120 m²</text>
  <text class="zonaSub" x="586" y="612">Ciclo: 6 días de fermentación + 7 de secado</text>

  <!-- ===== Reservorio ===== -->
  <rect class="zona" x="336" y="530" width="212" height="150" fill="#cffafe"/>
  <text class="zonaTit" x="352" y="556">Pozo de Lucas</text>
  <text class="zonaSub" x="352" y="576">Reservorio de 48 m³</text>
  <text class="zonaSub" x="352" y="594">Bomba de 2,2 kW</text>
  <text class="zonaSub" x="352" y="612">Riego por goteo a 3 lotes</text>

  <!-- ===== Bodega ===== -->
  <rect class="zona" x="806" y="296" width="80" height="150" fill="#e2e8f0"/>
  <text class="zonaTit" x="812" y="322" font-size="13">Bodega</text>
  <text class="zonaSub" x="812" y="342">Zenón</text>
  <text class="zonaSub" x="812" y="360">1200</text>
  <text class="zonaSub" x="812" y="376">sacos</text>

  <!-- ===== Chips de dispositivos ===== -->
  <g>
    <rect class="chip" x="248" y="240" width="58" height="26" fill="#2563eb"/><text class="chipTxt" x="258" y="258">DEV01</text>
    <rect class="chip" x="248" y="408" width="58" height="26" fill="#16a34a"/><text class="chipTxt" x="258" y="426">DEV02</text>
    <rect class="chip" x="248" y="642" width="58" height="26" fill="#d97706"/><text class="chipTxt" x="258" y="660">DEV03</text>
    <rect class="chip" x="482" y="240" width="58" height="26" fill="#16a34a"/><text class="chipTxt" x="492" y="258">DEV04</text>
    <rect class="chip" x="482" y="408" width="58" height="26" fill="#7c3aed"/><text class="chipTxt" x="492" y="426">DEV05</text>
    <rect class="chip" x="716" y="240" width="58" height="26" fill="#e11d48"/><text class="chipTxt" x="726" y="258">DEV06</text>
    <rect class="chip" x="482" y="316" width="58" height="26" fill="#e11d48"/><text class="chipTxt" x="492" y="334">DEV07</text>
    <rect class="chip" x="820" y="642" width="58" height="26" fill="#2563eb"/><text class="chipTxt" x="830" y="660">DEV08</text>
    <rect class="chip" x="482" y="642" width="58" height="26" fill="#0891b2"/><text class="chipTxt" x="492" y="660">DEV09</text>
    <rect class="chip" x="816" y="408" width="58" height="26" fill="#db2777"/><text class="chipTxt" x="826" y="426">DEV10</text>
  </g>

  <!-- Torre de comunicaciones -->
  <g transform="translate(404,452)">
    <path d="M0,0 L-14,42 L14,42 Z" fill="none" stroke="#475569" stroke-width="2.5"/>
    <circle cx="0" cy="-6" r="5" fill="#f59e0b"/>
    <path d="M-12,-14 A 17 17 0 0 1 12,-14" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <path d="M-20,-22 A 28 28 0 0 1 20,-22" fill="none" stroke="#f59e0b" stroke-width="1.6" opacity="0.7"/>
  </g>

  <!-- ===== Leyenda ===== -->
  <rect x="940" y="86" width="228" height="700" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="958" y="116" font-size="16" font-weight="700" fill="#0f172a">Catálogo de nodos</text>

  <g class="leyenda">
    <rect x="958" y="132" width="16" height="16" rx="4" fill="#2563eb"/>
    <text x="982" y="145">DEV01 · Lote 1</text>
    <text x="982" y="161" class="nota">Wokwi ESP32 #1 · 15 s</text>

    <rect x="958" y="176" width="16" height="16" rx="4" fill="#16a34a"/>
    <text x="982" y="189">DEV02 · Lote 2</text>
    <text x="982" y="205" class="nota">Python SDK · MQTT 8883 · 15 s</text>

    <rect x="958" y="220" width="16" height="16" rx="4" fill="#d97706"/>
    <text x="982" y="233">DEV03 · Lote 3</text>
    <text x="982" y="249" class="nota">Digital Twin nativo · 30 s</text>

    <rect x="958" y="264" width="16" height="16" rx="4" fill="#16a34a"/>
    <text x="982" y="277">DEV04 · Dosel</text>
    <text x="982" y="293" class="nota">Python #2 · MQTT/WSS 443 · 60 s</text>

    <rect x="958" y="308" width="16" height="16" rx="4" fill="#7c3aed"/>
    <text x="982" y="321">DEV05 · Estación de campo</text>
    <text x="982" y="337" class="nota">Replay de CSV · 60 s · con huecos</text>

    <rect x="958" y="352" width="16" height="16" rx="4" fill="#e11d48"/>
    <text x="982" y="365">DEV06 · Meteorología</text>
    <text x="982" y="381" class="nota">Atlas Weather · 5 min</text>

    <rect x="958" y="396" width="16" height="16" rx="4" fill="#e11d48"/>
    <text x="982" y="409">DEV07 · Calidad de aire</text>
    <text x="982" y="425" class="nota">Open-Meteo · 10 min</text>

    <rect x="958" y="440" width="16" height="16" rx="4" fill="#2563eb"/>
    <text x="982" y="453">DEV08 · Secado y fermentación</text>
    <text x="982" y="469" class="nota">Wokwi ESP32 #2 · 20 s</text>

    <rect x="958" y="484" width="16" height="16" rx="4" fill="#0891b2"/>
    <text x="982" y="497">DEV09 · Reservorio y riego</text>
    <text x="982" y="513" class="nota">Puente HTTP/REST · 2 min</text>

    <rect x="958" y="528" width="16" height="16" rx="4" fill="#db2777"/>
    <text x="982" y="541">DEV10 · Perímetro y bodega</text>
    <text x="982" y="557" class="nota">MQTT crudo (paho) · 30 s</text>
  </g>

  <line x1="958" y1="580" x2="1150" y2="580" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="958" y="602" font-size="14" font-weight="700" fill="#0f172a">Indispensables del escenario</text>
  <text x="958" y="624" class="nota">Humedad de suelo: DEV01, DEV02 y DEV03</text>
  <text x="958" y="642" class="nota">Nodo meteorológico explícito: DEV06</text>

  <text x="958" y="676" font-size="14" font-weight="700" fill="#0f172a">Salida a Internet</text>
  <text x="958" y="698" class="nota">4G/LTE principal desde la Casa de</text>
  <text x="958" y="714" class="nota">Zenón; Starlink de respaldo. No hay</text>
  <text x="958" y="730" class="nota">fibra en la vereda y el operador</text>
  <text x="958" y="746" class="nota">entrega la línea detrás de un CGNAT,</text>
  <text x="958" y="762" class="nota">por eso DEV04 sale por WSS/443.</text>
</svg>
