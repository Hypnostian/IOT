# Ejemplo SIN valores reales. No se aplica tal cual: scripts/crear_secretos.sh crea estos Secrets
# en el clúster con claves aleatorias que nunca se guardan en el repositorio.
apiVersion: v1
kind: Secret
metadata:
  name: wordpress-db
  namespace: wordpress
type: Opaque
stringData:
  MARIADB_ROOT_PASSWORD: CAMBIAR
  MARIADB_DATABASE: wordpress
  MARIADB_USER: wordpress
  MARIADB_PASSWORD: CAMBIAR
---
apiVersion: v1
kind: Secret
metadata:
  name: wordpress-admin
  namespace: wordpress
type: Opaque
stringData:
  WP_ADMIN_USER: admin
  WP_ADMIN_PASSWORD: CAMBIAR
  WP_ADMIN_EMAIL: admin@example.com
