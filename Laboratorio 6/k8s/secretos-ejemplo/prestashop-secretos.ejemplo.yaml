# Ejemplo SIN valores reales. No se aplica tal cual: scripts/crear_secretos.sh crea estos Secrets
# en el clúster con claves aleatorias que nunca se guardan en el repositorio.
apiVersion: v1
kind: Secret
metadata:
  name: prestashop-db
  namespace: prestashop
type: Opaque
stringData:
  MARIADB_ROOT_PASSWORD: CAMBIAR
  MARIADB_DATABASE: prestashop
  MARIADB_USER: prestashop
  MARIADB_PASSWORD: CAMBIAR
---
apiVersion: v1
kind: Secret
metadata:
  name: prestashop-admin
  namespace: prestashop
type: Opaque
stringData:
  ADMIN_MAIL: admin@example.com
  ADMIN_PASSWD: CAMBIAR
