# Portal PrestaShop: PVC + Deployment. Su Service LoadBalancer esta en 15-servicio.yaml.
# La imagen instala la tienda la primera vez con su instalador por linea de comandos (PS_INSTALL_AUTO=1),
# usando la base de datos de este namespace y el dominio publicado en el ConfigMap prestashop-dominio.
# No se define PS_FOLDER_ADMIN: el instalador de PrestaShop 9 renombra la carpeta admin con un nombre
# aleatorio y falla si ya la encuentra renombrada.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prestashop-contenido
  namespace: prestashop
  labels:
    app.kubernetes.io/name: prestashop
    app.kubernetes.io/part-of: portal-prestashop
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: managed-csi
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prestashop
  namespace: prestashop
  labels:
    app.kubernetes.io/name: prestashop
    app.kubernetes.io/component: portal
    app.kubernetes.io/part-of: portal-prestashop
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prestashop
      app.kubernetes.io/part-of: portal-prestashop
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prestashop
        app.kubernetes.io/component: portal
        app.kubernetes.io/part-of: portal-prestashop
    spec:
      containers:
        - name: prestashop
          image: prestashop/prestashop:9.1-apache
          ports:
            - name: http
              containerPort: 80
          env:
            - name: DB_SERVER
              value: mariadb # el Service ClusterIP de este mismo namespace
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: prestashop-db
                  key: MARIADB_DATABASE
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: prestashop-db
                  key: MARIADB_USER
            - name: DB_PASSWD
              valueFrom:
                secretKeyRef:
                  name: prestashop-db
                  key: MARIADB_PASSWORD
            - name: DB_PREFIX
              value: ps_
            - name: PS_INSTALL_AUTO
              value: "1"
            - name: PS_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: prestashop-dominio
                  key: PS_DOMAIN
            - name: PS_LANGUAGE
              value: es
            - name: PS_COUNTRY
              value: CO
            - name: PS_ENABLE_SSL
              value: "0"
            - name: PS_FOLDER_INSTALL
              value: install-lab6
            - name: ADMIN_MAIL
              valueFrom:
                secretKeyRef:
                  name: prestashop-admin
                  key: ADMIN_MAIL
            - name: ADMIN_PASSWD
              valueFrom:
                secretKeyRef:
                  name: prestashop-admin
                  key: ADMIN_PASSWD
          volumeMounts:
            - name: contenido
              mountPath: /var/www/html
              subPath: html
          # La primera instalacion tarda varios minutos y Apache solo arranca al terminar.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1536Mi
      volumes:
        - name: contenido
          persistentVolumeClaim:
            claimName: prestashop-contenido
