# Portal WordPress: PVC + Deployment + Service LoadBalancer (IP publica).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-contenido
  namespace: wordpress
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/part-of: portal-wordpress
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: managed-csi
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: wordpress
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/component: portal
    app.kubernetes.io/part-of: portal-wordpress
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wordpress
      app.kubernetes.io/part-of: portal-wordpress
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wordpress
        app.kubernetes.io/component: portal
        app.kubernetes.io/part-of: portal-wordpress
    spec:
      containers:
        - name: wordpress
          image: wordpress:7.1-php8.3-apache
          ports:
            - name: http
              containerPort: 80
          env:
            - name: WORDPRESS_DB_HOST
              value: mariadb:3306 # el Service ClusterIP de este mismo namespace
            - name: WORDPRESS_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: wordpress-db
                  key: MARIADB_DATABASE
            - name: WORDPRESS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: wordpress-db
                  key: MARIADB_USER
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wordpress-db
                  key: MARIADB_PASSWORD
          volumeMounts:
            - name: contenido
              mountPath: /var/www/html
              subPath: html
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
        # Contenedor de administracion con wp-cli: instala WordPress y crea la pagina de prueba
        # (scripts/instalar_portales.sh). Comparte el volumen y la conexion a la base de datos.
        - name: wp-cli
          image: wordpress:cli-2.12-php8.3
          command: ["sh", "-c", "trap 'exit 0' TERM; while :; do sleep 5; done"]
          workingDir: /var/www/html
          env:
            - name: WORDPRESS_DB_HOST
              value: mariadb:3306
            - name: WORDPRESS_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: wordpress-db
                  key: MARIADB_DATABASE
            - name: WORDPRESS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: wordpress-db
                  key: MARIADB_USER
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wordpress-db
                  key: MARIADB_PASSWORD
            - name: WP_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: wordpress-admin
                  key: WP_ADMIN_USER
            - name: WP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wordpress-admin
                  key: WP_ADMIN_PASSWORD
            - name: WP_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: wordpress-admin
                  key: WP_ADMIN_EMAIL
          volumeMounts:
            - name: contenido
              mountPath: /var/www/html
              subPath: html
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
      volumes:
        - name: contenido
          persistentVolumeClaim:
            claimName: wordpress-contenido
---
# Service LoadBalancer de WordPress, en el puerto 80. scripts/desplegar.sh le agrega la anotacion
# service.beta.kubernetes.io/azure-pip-name para compartir la IP publica con PrestaShop (puerto 8080).
apiVersion: v1
kind: Service
metadata:
  name: wordpress
  namespace: wordpress
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/part-of: portal-wordpress
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/part-of: portal-wordpress
  ports:
    - name: http
      port: 80
      targetPort: http
